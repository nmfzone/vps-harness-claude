---
- name: Set UFW defaults
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Allow outgoing traffic
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port }}"
    proto: tcp

- name: Allow Paseo only over Tailscale
  community.general.ufw:
    rule: allow
    interface_in: tailscale0
    port: "{{ paseo_port }}"
    proto: tcp

- name: Enable UFW
  community.general.ufw:
    state: enabled
